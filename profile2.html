<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudentVault — Profile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#0a1628;color:#e8edf5;font-family:Arial,sans-serif;display:flex;min-height:100vh;}
.sidebar{width:240px;flex-shrink:0;background:#111e36;border-right:1px solid #1e3058;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;}
.sb-logo{display:flex;align-items:center;gap:11px;padding:20px 16px;border-bottom:1px solid #1e3058;}
.sb-logo-icon{font-size:24px;}.sb-logo-title{font-size:1rem;color:#e8edf5;font-weight:700;font-family:Georgia,serif;}.sb-logo-sub{font-size:.68rem;color:#8a9bb5;}
.sb-user{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #1e3058;}
.sb-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#c9a84c,#e8c96a);display:flex;align-items:center;justify-content:center;color:#0a1628;font-weight:700;font-size:.9rem;flex-shrink:0;}
.sb-nm{font-size:.85rem;font-weight:600;color:#e8edf5;}.sb-em{font-size:.68rem;color:#8a9bb5;word-break:break-all;}
.sb-links{list-style:none;padding:10px 8px;flex:1;}
.sb-links li{margin-bottom:2px;}
.sb-links a{display:block;padding:10px 12px;border-radius:9px;color:#8a9bb5;text-decoration:none;font-size:.86rem;}
.sb-links a:hover{background:#0f2040;color:#e8edf5;}
.sb-links a.on{background:rgba(201,168,76,.14);color:#c9a84c;border-left:3px solid #c9a84c;padding-left:9px;}
.sb-out{margin:10px 8px;padding:10px;background:transparent;border:1px solid #1e3058;border-radius:9px;color:#8a9bb5;font-size:.83rem;cursor:pointer;width:calc(100% - 16px);}
.sb-out:hover{border-color:#e05c5c;color:#e05c5c;}
.topbar{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:#111e36;border-bottom:1px solid #1e3058;align-items:center;padding:0 14px;z-index:200;gap:10px;}
.hbtn{background:none;border:none;color:#e8edf5;font-size:1.3rem;cursor:pointer;}
.topbar-t{font-size:1rem;color:#e8edf5;flex:1;font-family:Georgia,serif;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;}
.overlay.on{display:block;}
.main{margin-left:240px;flex:1;padding:28px;background:#0a1628;min-height:100vh;}

/* action bar */
.abar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
.back{color:#8a9bb5;text-decoration:none;font-size:.88rem;}
.back:hover{color:#c9a84c;}
.abts{display:flex;gap:8px;flex-wrap:wrap;}
.btn-action{padding:8px 16px;border-radius:8px;font-size:.83rem;cursor:pointer;font-family:Arial,sans-serif;}
.btn-pdf{background:linear-gradient(135deg,#c9a84c,#e8c96a);border:none;color:#0a1628;font-weight:700;}
.btn-edit{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);color:#c9a84c;}
.btn-del{background:rgba(224,92,92,.08);border:1px solid rgba(224,92,92,.25);color:#e05c5c;}
.btn-photo{background:rgba(80,160,220,.1);border:1px solid rgba(80,160,220,.3);color:#5aa0dc;}

/* layout */
.layout{display:grid;grid-template-columns:230px 1fr;gap:22px;}
.lp{display:flex;flex-direction:column;gap:16px;}

/* ── PHOTO CARD ── */
.photocard{background:#111e36;border:1px solid #1e3058;border-radius:14px;padding:22px;text-align:center;}
.photo-wrap{position:relative;width:120px;height:120px;margin:0 auto 14px;}
.pphoto{
  width:120px;height:120px;border-radius:50%;
  border:3px solid #c9a84c;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;background:#0f2040;
}
.pphoto img{width:100%;height:100%;object-fit:cover;display:block;}
/* camera overlay on photo */
.photo-edit-btn{
  position:absolute;bottom:0;right:0;
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,#c9a84c,#e8c96a);
  border:3px solid #0a1628;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:1rem;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
.photo-edit-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;border-radius:50%;z-index:5;}
/* visible upload button below student photo */
.upload-btn{
  display:block;width:100%;margin-top:10px;
  padding:8px 0;
  background:rgba(201,168,76,.12);
  border:1px dashed #c9a84c;
  border-radius:8px;
  color:#c9a84c;font-size:.8rem;
  cursor:pointer;text-align:center;
  position:relative;
}
.upload-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:5;}
.upload-btn:hover{background:rgba(201,168,76,.22);}
.pname{font-family:Georgia,serif;font-size:1.1rem;color:#e8edf5;font-weight:700;}
.pprog{font-size:.75rem;color:#8a9bb5;margin-top:4px;line-height:1.6;}
.pbatch{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:20px;background:rgba(201,168,76,.12);color:#c9a84c;font-size:.78rem;}

/* ── PARENT PHOTOS CARD ── */
.parcard{background:#111e36;border:1px solid #1e3058;border-radius:14px;padding:18px;}
.parcard-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:#8a9bb5;margin-bottom:14px;font-weight:700;}
.paritem{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:16px;}
.par-photo-wrap{position:relative;width:90px;height:90px;}
.parcircle{
  width:90px;height:90px;border-radius:50%;
  border:2px solid #1e3058;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;background:#0f2040;
}
.parcircle img{width:100%;height:100%;object-fit:cover;display:block;}
/* camera button on parent photos */
.par-edit-btn{
  position:absolute;bottom:0;right:0;
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#c9a84c,#e8c96a);
  border:2px solid #0a1628;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:.75rem;
  box-shadow:0 2px 6px rgba(0,0,0,.5);
}
.par-edit-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;border-radius:50%;z-index:5;}
/* visible upload button below parent photo */
.par-upload-btn{
  display:block;width:100%;margin-top:6px;
  padding:5px 0;
  background:rgba(201,168,76,.1);
  border:1px dashed rgba(201,168,76,.5);
  border-radius:7px;
  color:#c9a84c;font-size:.72rem;
  cursor:pointer;text-align:center;
  position:relative;
}
.par-upload-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:5;}
.par-upload-btn:hover{background:rgba(201,168,76,.2);}
.parlbl{font-size:.75rem;color:#8a9bb5;font-weight:600;}
.photo-uploading{font-size:.75rem;color:#c9a84c;margin-top:4px;display:none;text-align:center;}

/* right panel */
.rp{display:flex;flex-direction:column;gap:18px;}
.isec{background:#111e36;border:1px solid #1e3058;border-radius:14px;overflow:hidden;}
.ishdr{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #1e3058;background:#0f2040;}
.ishdr h3{font-size:.9rem;color:#e8edf5;font-weight:600;}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.irow{padding:11px 16px;border-bottom:1px solid rgba(30,48,88,.6);}
.irow:last-child{border-bottom:none;}
.ilbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:#8a9bb5;margin-bottom:4px;font-weight:700;}
.ival{font-size:.88rem;color:#e8edf5;line-height:1.4;word-break:break-word;}
.ival.gold{color:#c9a84c;font-weight:600;}

/* edit modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;align-items:center;justify-content:center;}
.modal.open{display:flex;}
.mbox{background:#111e36;border:1px solid #1e3058;border-radius:18px;width:100%;max-width:700px;max-height:88vh;overflow-y:auto;padding:28px;margin:14px;}
.mhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.mhdr h2{font-family:Georgia,serif;font-size:1.2rem;color:#e8edf5;}
.mclose{background:none;border:none;color:#8a9bb5;font-size:1.4rem;cursor:pointer;}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;}
.ef label{display:block;font-size:.7rem;font-weight:700;color:#8a9bb5;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.ef input,.ef select,.ef textarea{width:100%;padding:9px 11px;background:#0a1628;border:1px solid #1e3058;border-radius:8px;color:#e8edf5;font-size:.86rem;outline:none;font-family:Arial,sans-serif;}
.ef input:focus,.ef select:focus{border-color:#c9a84c;}
.ef select option{background:#0f2040;}
.ef textarea{resize:vertical;min-height:65px;}
.macts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
.bcancel{padding:10px 22px;background:transparent;border:1px solid #1e3058;border-radius:9px;color:#8a9bb5;font-size:.88rem;cursor:pointer;}
.bsavem{padding:10px 26px;background:linear-gradient(135deg,#c9a84c,#e8c96a);border:none;border-radius:9px;color:#0a1628;font-size:.88rem;font-weight:700;cursor:pointer;}

.nf{text-align:center;padding:70px;color:#8a9bb5;}
.nf a{color:#c9a84c;text-decoration:none;}

@media print{
  .sidebar,.topbar,.overlay,.abar,.modal{display:none!important;}
  html,body{background:#fff!important;color:#000!important;display:block;}
  .main{margin:0!important;padding:10px!important;}
  .layout{grid-template-columns:180px 1fr!important;}
  .photocard,.parcard,.isec{background:#fff!important;border:1px solid #ccc!important;break-inside:avoid;margin-bottom:10px;}
  .ishdr{background:#f0f0f0!important;}
  .ishdr h3,.pname,.ival{color:#000!important;}
  .ival.gold{color:#8a6b00!important;}
  .ilbl{color:#555!important;}
  .photo-edit-btn,.par-edit-btn{display:none!important;}
}
@media(max-width:800px){
  .sidebar{transform:translateX(-100%);transition:transform .28s;}
  .sidebar.open{transform:translateX(0);}
  .topbar{display:flex;}
  .main{margin-left:0;padding:66px 13px 22px;}
  .layout{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="sidebar" id="sb">
  <div class="sb-logo"><div class="sb-logo-icon">🎓</div><div><div class="sb-logo-title">StudentVault</div><div class="sb-logo-sub">Management System</div></div></div>
  <div class="sb-user"><div class="sb-av" id="sav">A</div><div><div class="sb-nm" id="snm">Admin</div><div class="sb-em" id="sem">Loading...</div></div></div>
  <ul class="sb-links">
    <li><a href="dashboard.html">📊 Dashboard</a></li>
    <li><a href="students.html" class="on">👥 All Students</a></li>
    <li><a href="add-student.html">➕ Add Student</a></li>
  </ul>
  <button class="sb-out" id="btnOut">🚪 Sign Out</button>
</div>
<div class="overlay" id="ov" onclick="closeNav()"></div>
<header class="topbar"><button class="hbtn" onclick="openNav()">☰</button><div class="topbar-t">Student Profile</div></header>

<main class="main" id="main"><div class="nf">Loading...</div></main>

<!-- Edit Modal -->
<div class="modal" id="modal">
  <div class="mbox">
    <div class="mhdr"><h2>✏️ Edit Student Details</h2><button class="mclose" id="mclose">✕</button></div>
    <div class="egrid" id="egrid"></div>
    <div class="macts">
      <button class="bcancel" id="bcancel">Cancel</button>
      <button class="bsavem" id="bsavem">Save Changes</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-storage.js";

const cfg = {
  apiKey:"AIzaSyAWY0l0iJr2Pzk0TFLy2IQjD-y4i6gT5d8",
  authDomain:"data-fc399.firebaseapp.com",
  projectId:"data-fc399",
  storageBucket:"data-fc399.firebasestorage.app",
  messagingSenderId:"239642224017",
  appId:"1:239642224017:web:bf4f681a2492bf2e12e630"
};
const app     = initializeApp(cfg);
const auth    = getAuth(app);
const db      = getFirestore(app);
const storage = getStorage(app);
const sid     = new URLSearchParams(location.search).get('id');
let sdata     = {};

window.openNav  = ()=>{ document.getElementById('sb').classList.add('open'); document.getElementById('ov').classList.add('on'); };
window.closeNav = ()=>{ document.getElementById('sb').classList.remove('open'); document.getElementById('ov').classList.remove('on'); };

document.getElementById('btnOut').addEventListener('click', ()=>signOut(auth).then(()=>location.href='index.html'));
document.getElementById('mclose').addEventListener('click', ()=>document.getElementById('modal').classList.remove('open'));
document.getElementById('bcancel').addEventListener('click', ()=>document.getElementById('modal').classList.remove('open'));

function toast(msg, type='success'){
  const old=document.getElementById('sv-toast'); if(old)old.remove();
  const t=document.createElement('div'); t.id='sv-toast';
  t.style.cssText=`position:fixed;bottom:24px;right:16px;z-index:9999;padding:13px 18px;border-radius:11px;font-size:.86rem;display:flex;align-items:center;gap:9px;max-width:300px;box-shadow:0 6px 24px rgba(0,0,0,.5);font-family:Arial,sans-serif;background:${type==='error'?'#4d1e1e':'#1b4d2e'};border:1px solid ${type==='error'?'rgba(200,80,80,.4)':'rgba(80,200,100,.4)'};color:${type==='error'?'#f08080':'#90e0a0'};`;
  t.textContent=(type==='error'?'❌  ':'✅  ')+msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),4000);
}

const v = x => x||'—';

// ── Upload photo to Firebase Storage ──
async function uploadPhoto(file, path){
  const r = ref(storage, path);
  const snap = await uploadBytes(r, file);
  return await getDownloadURL(snap.ref);
}

// ── Auth check ──
onAuthStateChanged(auth, async u=>{
  if(!u){location.href='index.html';return;}
  const nm=u.displayName||u.email.split('@')[0];
  document.getElementById('snm').textContent=nm;
  document.getElementById('sem').textContent=u.email;
  document.getElementById('sav').textContent=nm[0].toUpperCase();
  if(!sid){document.getElementById('main').innerHTML='<div class="nf">No student ID. <a href="students.html">← Back</a></div>';return;}
  try{
    const snap=await getDoc(doc(db,'students',sid));
    if(!snap.exists()){document.getElementById('main').innerHTML='<div class="nf">Student not found. <a href="students.html">← Back</a></div>';return;}
    sdata={id:snap.id,...snap.data()};
    render(sdata);
  }catch(e){
    document.getElementById('main').innerHTML=`<div class="nf">Error: ${e.message}</div>`;
  }
});

// ── Render full profile ──
function render(s){
  document.title=`${s.firstName||''} ${s.lastName||''} — StudentVault`;
  document.getElementById('main').innerHTML=`
  <div class="abar">
    <a class="back" href="students.html">← All Students</a>
    <div class="abts">
      <button class="btn-action btn-pdf" id="btnPdf">📄 Download PDF</button>
      <button class="btn-action btn-edit" id="btnEdit">✏️ Edit Details</button>
      <button class="btn-action btn-del" id="btnDel">🗑 Delete</button>
    </div>
  </div>

  <div class="layout">
    <!-- Left Panel -->
    <div class="lp">

      <!-- Student Photo Card -->
      <div class="photocard">
        <div class="photo-wrap">
          <div class="pphoto" id="mainPhotoEl">
            ${s.photoURL ? `<img id="mainPhotoImg" src="${s.photoURL}" alt="Student">` : `<span id="mainPhotoImg">👤</span>`}
          </div>
          <div class="photo-edit-btn" title="Change student photo">
            📷
            <input type="file" accept="image/*" id="inputStudentPhoto">
          </div>
        </div>
        <!-- Visible upload button -->
        <label class="upload-btn">
          📷 Change Student Photo
          <input type="file" accept="image/*" id="inputStudentPhoto2">
        </label>
        <div id="photoUploadStatus" class="photo-uploading">Uploading...</div>
        <div class="pname">${v(s.firstName)} ${v(s.lastName)}</div>
        <div class="pprog">${v(s.programme)}<br>${v(s.department)}</div>
        <span class="pbatch">${v(s.batch)}</span>
      </div>

      <!-- Parent Photos Card -->
      <div class="parcard">
        <div class="parcard-title">📸 Photos</div>

        <!-- Father -->
        <div class="paritem">
          <div class="par-photo-wrap">
            <div class="parcircle" id="fatherPhotoEl">
              ${s.fatherURL ? `<img id="fatherPhotoImg" src="${s.fatherURL}" alt="Father">` : `<span id="fatherPhotoImg">👨</span>`}
            </div>
            <div class="par-edit-btn" title="Change father photo">
              📷
              <input type="file" accept="image/*" id="inputFatherPhoto">
            </div>
          </div>
          <div class="parlbl">Father</div>
          <label class="par-upload-btn">
            📷 Upload Father Photo
            <input type="file" accept="image/*" id="inputFatherPhoto2">
          </label>
          <div class="photo-uploading" id="fatherUploadStatus">Uploading...</div>
        </div>

        <!-- Mother -->
        <div class="paritem">
          <div class="par-photo-wrap">
            <div class="parcircle" id="motherPhotoEl">
              ${s.motherURL ? `<img id="motherPhotoImg" src="${s.motherURL}" alt="Mother">` : `<span id="motherPhotoImg">👩</span>`}
            </div>
            <div class="par-edit-btn" title="Change mother photo">
              📷
              <input type="file" accept="image/*" id="inputMotherPhoto">
            </div>
          </div>
          <div class="parlbl">Mother</div>
          <label class="par-upload-btn">
            📷 Upload Mother Photo
            <input type="file" accept="image/*" id="inputMotherPhoto2">
          </label>
          <div class="photo-uploading" id="motherUploadStatus">Uploading...</div>
        </div>
      </div>

    </div>

    <!-- Right Panel -->
    <div class="rp">
      <div class="isec">
        <div class="ishdr"><span>👤</span><h3>Personal Information</h3></div>
        <div class="igrid">
          <div class="irow"><div class="ilbl">Full Name</div><div class="ival">${v(s.firstName)} ${v(s.lastName)}</div></div>
          <div class="irow"><div class="ilbl">Register Number</div><div class="ival gold">${v(s.registerNumber)}</div></div>
          <div class="irow"><div class="ilbl">Gender</div><div class="ival">${v(s.gender)}</div></div>
          <div class="irow"><div class="ilbl">Date of Birth</div><div class="ival">${v(s.dob)}</div></div>
          <div class="irow"><div class="ilbl">Blood Group</div><div class="ival">${v(s.bloodGroup)}</div></div>
          <div class="irow"><div class="ilbl">Languages Known</div><div class="ival">${v(s.languages)}</div></div>
          <div class="irow"><div class="ilbl">Religion</div><div class="ival">${v(s.religion)}</div></div>
          <div class="irow"><div class="ilbl">Community</div><div class="ival">${v(s.community)}</div></div>
          <div class="irow"><div class="ilbl">Caste</div><div class="ival">${v(s.caste)}</div></div>
          <div class="irow"><div class="ilbl">Physical ID</div><div class="ival">${v(s.physicalId)}</div></div>
          <div class="irow"><div class="ilbl">Nationality</div><div class="ival">${v(s.nationality)}</div></div>
          <div class="irow"><div class="ilbl">Aadhar Number</div><div class="ival">${v(s.aadhar)}</div></div>
        </div>
      </div>
      <div class="isec">
        <div class="ishdr"><span>🎓</span><h3>Academic Information</h3></div>
        <div class="igrid">
          <div class="irow"><div class="ilbl">Programme</div><div class="ival">${v(s.programme)}</div></div>
          <div class="irow"><div class="ilbl">Department</div><div class="ival">${v(s.department)}</div></div>
          <div class="irow"><div class="ilbl">Batch</div><div class="ival gold">${v(s.batch)}</div></div>
          <div class="irow"><div class="ilbl">Admission Date</div><div class="ival">${v(s.admissionDate)}</div></div>
          <div class="irow"><div class="ilbl">Admission Category</div><div class="ival">${v(s.admissionCategory)}</div></div>
          <div class="irow"><div class="ilbl">Admission Type</div><div class="ival">${v(s.admissionType)}</div></div>
          <div class="irow"><div class="ilbl">Cut-Off Mark</div><div class="ival">${v(s.cutOff)}</div></div>
          <div class="irow"><div class="ilbl">NEET/JEE</div><div class="ival">${v(s.neetJee)}</div></div>
          <div class="irow"><div class="ilbl">EMIS No</div><div class="ival">${v(s.emis)}</div></div>
          <div class="irow"><div class="ilbl">UMIS No</div><div class="ival">${v(s.umis)}</div></div>
          <div class="irow"><div class="ilbl">Hostel Room</div><div class="ival">${v(s.hostelRoom)}</div></div>
        </div>
      </div>
      <div class="isec">
        <div class="ishdr"><span>📞</span><h3>Contact Information</h3></div>
        <div class="igrid">
          <div class="irow"><div class="ilbl">Mobile</div><div class="ival">${v(s.mobile)}</div></div>
          <div class="irow"><div class="ilbl">Parent Mobile</div><div class="ival">${v(s.parentMobile)}</div></div>
          <div class="irow"><div class="ilbl">Personal Email</div><div class="ival">${v(s.personalEmail)}</div></div>

// ── Generic photo upload setup ──
function setupPhotoUpload(inputId, imgId, statusId, field, storagePath){
  document.getElementById(inputId).addEventListener('change', async function(){
    const file = this.files[0];
    if(!file) return;

    // Show preview immediately
    const reader = new FileReader();
    reader.onload = e => {
      const el = document.getElementById(imgId);
      if(el.tagName === 'IMG'){
        el.src = e.target.result;
      } else {
        // Replace emoji span with img
        const img = document.createElement('img');
        img.id = imgId;
        img.src = e.target.result;
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
        el.replaceWith(img);
      }
    };
    reader.readAsDataURL(file);

    // Upload to Firebase Storage
    const status = document.getElementById(statusId);
    status.textContent = 'Uploading...';
    status.style.display = 'block';

    try {
      const url = await uploadPhoto(file, storagePath);
      // Save URL to Firestore
      await updateDoc(doc(db,'students',sid), {
        [field]: url,
        updatedAt: serverTimestamp()
      });
      sdata[field] = url;
      status.textContent = '✅ Saved!';
      setTimeout(()=>{ status.style.display='none'; }, 2500);
      toast('Photo updated successfully!');
    } catch(e) {
      status.textContent = '❌ Failed';
      setTimeout(()=>{ status.style.display='none'; }, 3000);
      toast('Photo upload failed: '+e.message, 'error');
    }
  });
}

document.getElementById('bsavem').addEventListener('click', async ()=>{
  const keys=['firstName','lastName','gender','dob','bloodGroup','languages','physicalId','religion','community','caste',
    'registerNumber','programme','department','batch','admissionDate','admissionCategory','admissionType','cutOff','emis','umis','hostelRoom',
    'mobile','parentMobile','personalEmail','officialEmail','aadhar','pan','permanentAddress','tempAddress','city','state','zip',
    'bankName','accountNumber','ifsc','bankBranch','firstGraduate','educationalLoan','scholarshipType'];
  const upd={updatedAt:serverTimestamp()};
  keys.forEach(k=>{const el=document.getElementById('e_'+k);if(el)upd[k]=el.value.trim();});
  try{
    await updateDoc(doc(db,'students',sid),upd);
    sdata=Object.assign({},sdata,upd);
    document.getElementById('modal').classList.remove('open');
    render(sdata);
    toast('Student details updated!');
  }catch(e){toast('Update failed: '+e.message,'error');}
});

async function delStudent(){
  const name=`${sdata.firstName||''} ${sdata.lastName||''}`.trim();
  if(!confirm(`Delete ${name}?\nThis cannot be undone.`))return;
  try{
    await deleteDoc(doc(db,'students',sid));
    toast('Student deleted.');
    setTimeout(()=>location.href='students.html',1200);
  }catch(e){toast('Delete failed: '+e.message,'error');}
}
