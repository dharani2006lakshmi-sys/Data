<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudentVault — Profile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#0a1628;color:#e8edf5;font-family:Arial,sans-serif;display:flex;min-height:100vh;}
.sidebar{width:240px;flex-shrink:0;background:#111e36;border-right:1px solid #1e3058;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;}
.sb-logo{display:flex;align-items:center;gap:11px;padding:20px 16px;border-bottom:1px solid #1e3058;}
.sb-logo-icon{font-size:24px;}.sb-logo-title{font-size:1rem;color:#e8edf5;font-weight:700;font-family:Georgia,serif;}.sb-logo-sub{font-size:.68rem;color:#8a9bb5;}
.sb-user{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #1e3058;}
.sb-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#c9a84c,#e8c96a);display:flex;align-items:center;justify-content:center;color:#0a1628;font-weight:700;font-size:.9rem;flex-shrink:0;}
.sb-nm{font-size:.85rem;font-weight:600;color:#e8edf5;}.sb-em{font-size:.68rem;color:#8a9bb5;word-break:break-all;}
.sb-links{list-style:none;padding:10px 8px;flex:1;}
.sb-links li{margin-bottom:2px;}
.sb-links a{display:block;padding:10px 12px;border-radius:9px;color:#8a9bb5;text-decoration:none;font-size:.86rem;}
.sb-links a:hover{background:#0f2040;color:#e8edf5;}
.sb-links a.on{background:rgba(201,168,76,.14);color:#c9a84c;border-left:3px solid #c9a84c;padding-left:9px;}
.sb-out{margin:10px 8px;padding:10px;background:transparent;border:1px solid #1e3058;border-radius:9px;color:#8a9bb5;font-size:.83rem;cursor:pointer;width:calc(100% - 16px);}
.sb-out:hover{border-color:#e05c5c;color:#e05c5c;}
.topbar{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:#111e36;border-bottom:1px solid #1e3058;align-items:center;padding:0 14px;z-index:200;gap:10px;}
.hbtn{background:none;border:none;color:#e8edf5;font-size:1.3rem;cursor:pointer;}
.topbar-t{font-size:1rem;color:#e8edf5;flex:1;font-family:Georgia,serif;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;}
.overlay.on{display:block;}
.main{margin-left:240px;flex:1;padding:28px;background:#0a1628;min-height:100vh;}
.abar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
.back{color:#8a9bb5;text-decoration:none;font-size:.88rem;}
.back:hover{color:#c9a84c;}
.abts{display:flex;gap:8px;}
.bedit{padding:8px 18px;border-radius:8px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);color:#c9a84c;font-size:.84rem;cursor:pointer;}
.bdel{padding:8px 18px;border-radius:8px;background:rgba(224,92,92,.08);border:1px solid rgba(224,92,92,.25);color:#e05c5c;font-size:.84rem;cursor:pointer;}
.bprint{padding:8px 18px;border-radius:8px;background:rgba(80,130,220,.1);border:1px solid rgba(80,130,220,.25);color:#5a90e0;font-size:.84rem;cursor:pointer;}
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;}
.lp{display:flex;flex-direction:column;gap:14px;}
.pcard{background:#111e36;border:1px solid #1e3058;border-radius:14px;padding:22px;text-align:center;}
.pphoto{width:100px;height:100px;border-radius:50%;background:#0a1628;border:3px solid #c9a84c;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 12px;}
.pphoto img{width:100%;height:100%;object-fit:cover;}
.pname{font-family:Georgia,serif;font-size:1.1rem;color:#e8edf5;}
.pprog{font-size:.75rem;color:#8a9bb5;margin-top:4px;line-height:1.5;}
.pbatch{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:20px;background:rgba(201,168,76,.12);color:#c9a84c;font-size:.78rem;}
.parcard{background:#111e36;border:1px solid #1e3058;border-radius:14px;padding:16px;}
.parcard h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:#8a9bb5;margin-bottom:12px;}
.paritem{display:flex;flex-direction:column;align-items:center;gap:5px;margin-bottom:12px;}
.parcircle{width:72px;height:72px;border-radius:50%;background:#0a1628;border:2px solid #1e3058;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.parcircle img{width:100%;height:100%;object-fit:cover;}
.parlbl{font-size:.72rem;color:#8a9bb5;}
.rp{display:flex;flex-direction:column;gap:18px;}
.isec{background:#111e36;border:1px solid #1e3058;border-radius:14px;overflow:hidden;}
.ishdr{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #1e3058;background:#0f2040;}
.ishdr h3{font-size:.88rem;color:#e8edf5;}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
.irow{padding:10px 16px;border-bottom:1px solid rgba(30,48,88,.5);}
.irow:last-child{border-bottom:none;}
.ilbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:#8a9bb5;margin-bottom:3px;}
.ival{font-size:.86rem;color:#e8edf5;}
.ival.gold{color:#c9a84c;}
/* modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;}
.modal.open{display:flex;}
.mbox{background:#111e36;border:1px solid #1e3058;border-radius:18px;width:100%;max-width:680px;max-height:86vh;overflow-y:auto;padding:26px;margin:14px;}
.mhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.mhdr h2{font-family:Georgia,serif;font-size:1.15rem;color:#e8edf5;}
.mclose{background:none;border:none;color:#8a9bb5;font-size:1.3rem;cursor:pointer;}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
.ef label{display:block;font-size:.7rem;font-weight:700;color:#8a9bb5;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.ef input,.ef select,.ef textarea{width:100%;padding:9px 11px;background:#0a1628;border:1px solid #1e3058;border-radius:8px;color:#e8edf5;font-size:.85rem;outline:none;}
.ef input:focus,.ef select:focus{border-color:#c9a84c;}
.ef select option{background:#0f2040;}
.ef textarea{resize:vertical;min-height:60px;}
.macts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.bcancel{padding:10px 22px;background:transparent;border:1px solid #1e3058;border-radius:9px;color:#8a9bb5;font-size:.88rem;cursor:pointer;}
.bsavem{padding:10px 26px;background:linear-gradient(135deg,#c9a84c,#e8c96a);border:none;border-radius:9px;color:#0a1628;font-size:.88rem;font-weight:700;cursor:pointer;}
.nf{text-align:center;padding:70px;color:#8a9bb5;}
.nf a{color:#c9a84c;text-decoration:none;}
@media(max-width:800px){
  .sidebar{transform:translateX(-100%);transition:transform .28s;}
  .sidebar.open{transform:translateX(0);}
  .topbar{display:flex;}
  .main{margin-left:0;padding:66px 13px 22px;}
  .layout{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="sidebar" id="sb">
  <div class="sb-logo"><div class="sb-logo-icon">🎓</div><div><div class="sb-logo-title">StudentVault</div><div class="sb-logo-sub">Management System</div></div></div>
  <div class="sb-user"><div class="sb-av" id="sav">A</div><div><div class="sb-nm" id="snm">Admin</div><div class="sb-em" id="sem">Loading...</div></div></div>
  <ul class="sb-links">
    <li><a href="dashboard.html">📊 Dashboard</a></li>
    <li><a href="students.html" class="on">👥 All Students</a></li>
    <li><a href="add-student.html">➕ Add Student</a></li>
  </ul>
  <button class="sb-out" id="btnOut">🚪 Sign Out</button>
</div>
<div class="overlay" id="ov" onclick="closeNav()"></div>
<header class="topbar"><button class="hbtn" onclick="openNav()">☰</button><div class="topbar-t">Student Profile</div></header>
<main class="main" id="main"><div class="nf">Loading...</div></main>
<div class="modal" id="modal">
  <div class="mbox">
    <div class="mhdr"><h2>Edit Student</h2><button class="mclose" id="mclose">✕</button></div>
    <div class="egrid" id="egrid"></div>
    <div class="macts"><button class="bcancel" id="bcancel">Cancel</button><button class="bsavem" id="bsavem">Save Changes</button></div>
  </div>
</div>

<script type="module">
import { initializeApp }     from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const app  = initializeApp({ apiKey:"AIzaSyAWY0l0iJr2Pzk0TFLy2IQjD-y4i6gT5d8", authDomain:"data-fc399.firebaseapp.com", projectId:"data-fc399", storageBucket:"data-fc399.firebasestorage.app", messagingSenderId:"239642224017", appId:"1:239642224017:web:bf4f681a2492bf2e12e630" });
const auth = getAuth(app);
const db   = getFirestore(app);
const sid  = new URLSearchParams(location.search).get('id');
let sdata  = {};

window.openNav  = () => { document.getElementById('sb').classList.add('open');  document.getElementById('ov').classList.add('on'); };
window.closeNav = () => { document.getElementById('sb').classList.remove('open'); document.getElementById('ov').classList.remove('on'); };
document.getElementById('btnOut').addEventListener('click', () => signOut(auth).then(() => location.href='index.html'));
document.getElementById('mclose').addEventListener('click',  () => document.getElementById('modal').classList.remove('open'));
document.getElementById('bcancel').addEventListener('click', () => document.getElementById('modal').classList.remove('open'));

function toast(msg,type='success') {
  const old=document.getElementById('toast');if(old)old.remove();
  const t=document.createElement('div');t.id='toast';
  t.style.cssText='position:fixed;bottom:24px;right:16px;z-index:9999;padding:12px 17px;border-radius:11px;font-size:.86rem;display:flex;align-items:center;gap:8px;max-width:290px;box-shadow:0 6px 24px rgba(0,0,0,.5);font-family:Arial,sans-serif;background:'+(type==='error'?'#4d1e1e':'#1b4d2e')+';border:1px solid '+(type==='error'?'rgba(200,80,80,.4)':'rgba(80,200,100,.4)')+';color:'+(type==='error'?'#f08080':'#90e0a0')+';';
  t.innerHTML=(type==='error'?'❌ ':'✅ ')+msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3500);
}

const v = x => x||'—';

onAuthStateChanged(auth, async u => {
  if (!u) { location.href='index.html'; return; }
  const nm = u.displayName||u.email.split('@')[0];
  document.getElementById('snm').textContent = nm;
  document.getElementById('sem').textContent = u.email;
  document.getElementById('sav').textContent = nm[0].toUpperCase();
  if (!sid) { document.getElementById('main').innerHTML='<div class="nf">No student ID. <a href="students.html">← Back</a></div>'; return; }
  try {
    const snap = await getDoc(doc(db,'students',sid));
    if (!snap.exists()) { document.getElementById('main').innerHTML='<div class="nf">Student not found. <a href="students.html">← Back</a></div>'; return; }
    sdata = {id:snap.id,...snap.data()};
    render(sdata);
  } catch(e) { document.getElementById('main').innerHTML=`<div class="nf">Error: ${e.message}</div>`; }
});

function render(s) {
  document.title = `${s.firstName||''} ${s.lastName||''} — StudentVault`;
  document.getElementById('main').innerHTML = `
  <div class="abar">
    <a class="back" href="students.html">← All Students</a>
    <div class="abts">
      <button class="bprint" onclick="window.print()">🖨 Print</button>
      <button class="bedit" id="bedit">✏️ Edit</button>
      <button class="bdel" id="bdelBtn">🗑 Delete</button>
    </div>
  </div>
  <div class="layout">
    <div class="lp">
      <div class="pcard">
        <div class="pphoto">${s.photoURL?`<img src="${s.photoURL}">`:'👤'}</div>
        <div class="pname">${v(s.firstName)} ${v(s.lastName)}</div>
        <div class="pprog">${v(s.programme)}<br>${v(s.department)}</div>
        <span class="pbatch">${v(s.batch)}</span>
      </div>
      ${(s.fatherURL||s.motherURL)?`<div class="parcard"><h3>Parents</h3>
        ${s.fatherURL?`<div class="paritem"><div class="parcircle"><img src="${s.fatherURL}"></div><div class="parlbl">Father</div></div>`:''}
        ${s.motherURL?`<div class="paritem"><div class="parcircle"><img src="${s.motherURL}"></div><div class="parlbl">Mother</div></div>`:''}
      </div>`:''}
    </div>
    <div class="rp">
      <div class="isec"><div class="ishdr"><span>👤</span><h3>Personal Information</h3></div><div class="igrid">
        <div class="irow"><div class="ilbl">Full Name</div><div class="ival">${v(s.firstName)} ${v(s.lastName)}</div></div>
        <div class="irow"><div class="ilbl">Register Number</div><div class="ival gold">${v(s.registerNumber)}</div></div>
        <div class="irow"><div class="ilbl">Gender</div><div class="ival">${v(s.gender)}</div></div>
        <div class="irow"><div class="ilbl">Date of Birth</div><div class="ival">${v(s.dob)}</div></div>
        <div class="irow"><div class="ilbl">Blood Group</div><div class="ival">${v(s.bloodGroup)}</div></div>
        <div class="irow"><div class="ilbl">Languages</div><div class="ival">${v(s.languages)}</div></div>
        <div class="irow"><div class="ilbl">Religion</div><div class="ival">${v(s.religion)}</div></div>
        <div class="irow"><div class="ilbl">Community / Caste</div><div class="ival">${v(s.community)} / ${v(s.caste)}</div></div>
        <div class="irow"><div class="ilbl">Nationality</div><div class="ival">${v(s.nationality)}</div></div>
      </div></div>
      <div class="isec"><div class="ishdr"><span>🎓</span><h3>Academic Information</h3></div><div class="igrid">
        <div class="irow"><div class="ilbl">Programme</div><div class="ival">${v(s.programme)}</div></div>
        <div class="irow"><div class="ilbl">Department</div><div class="ival">${v(s.department)}</div></div>
        <div class="irow"><div class="ilbl">Batch</div><div class="ival gold">${v(s.batch)}</div></div>
        <div class="irow"><div class="ilbl">Admission Date</div><div class="ival">${v(s.admissionDate)}</div></div>
        <div class="irow"><div class="ilbl">Admission Category</div><div class="ival">${v(s.admissionCategory)}</div></div>
        <div class="irow"><div class="ilbl">Cut-Off</div><div class="ival">${v(s.cutOff)}</div></div>
        <div class="irow"><div class="ilbl">EMIS No</div><div class="ival">${v(s.emis)}</div></div>
        <div class="irow"><div class="ilbl">UMIS No</div><div class="ival">${v(s.umis)}</div></div>
        <div class="irow"><div class="ilbl">Hostel Room</div><div class="ival">${v(s.hostelRoom)}</div></div>
      </div></div>
      <div class="isec"><div class="ishdr"><span>📞</span><h3>Contact Information</h3></div><div class="igrid">
        <div class="irow"><div class="ilbl">Mobile</div><div class="ival">${v(s.mobile)}</div></div>
        <div class="irow"><div class="ilbl">Parent Mobile</div><div class="ival">${v(s.parentMobile)}</div></div>
        <div class="irow"><div class="ilbl">Personal Email</div><div class="ival">${v(s.personalEmail)}</div></div>
        <div class="irow"><div class="ilbl">Official Email</div><div class="ival">${v(s.officialEmail)}</div></div>
        <div class="irow"><div class="ilbl">Aadhar</div><div class="ival">${v(s.aadhar)}</div></div>
        <div class="irow"><div class="ilbl">PAN</div><div class="ival">${v(s.pan)}</div></div>
        <div class="irow"><div class="ilbl">Permanent Address</div><div class="ival">${v(s.permanentAddress)}</div></div>
        <div class="irow"><div class="ilbl">City / State / ZIP</div><div class="ival">${v(s.city)}, ${v(s.state)} - ${v(s.zip)}</div></div>
      </div></div>
      <div class="isec"><div class="ishdr"><span>💰</span><h3>Financial Aid</h3></div><div class="igrid">
        <div class="irow"><div class="ilbl">Bank Name</div><div class="ival">${v(s.bankName)}</div></div>
        <div class="irow"><div class="ilbl">Account Number</div><div class="ival">${v(s.accountNumber)}</div></div>
        <div class="irow"><div class="ilbl">IFSC</div><div class="ival">${v(s.ifsc)}</div></div>
        <div class="irow"><div class="ilbl">Branch</div><div class="ival">${v(s.bankBranch)}</div></div>
        <div class="irow"><div class="ilbl">First Graduate</div><div class="ival">${v(s.firstGraduate)}</div></div>
        <div class="irow"><div class="ilbl">Educational Loan</div><div class="ival">${v(s.educationalLoan)}</div></div>
        <div class="irow"><div class="ilbl">Scholarship</div><div class="ival">${v(s.scholarshipType)}</div></div>
      </div></div>
    </div>
  </div>`;

  document.getElementById('bedit').addEventListener('click', openModal);
  document.getElementById('bdelBtn').addEventListener('click', delStudent);
}

function openModal() {
  const s = sdata;
  const fields = [
    {l:'First Name',k:'firstName'},{l:'Last Name',k:'lastName'},
    {l:'Gender',k:'gender',o:['Male','Female','Other']},
    {l:'Date of Birth',k:'dob',t:'date'},
    {l:'Blood Group',k:'bloodGroup',o:['A+VE','A-VE','B+VE','B-VE','O+VE','O-VE','AB+VE','AB-VE']},
    {l:'Languages',k:'languages'},{l:'Physical ID',k:'physicalId'},
    {l:'Religion',k:'religion'},{l:'Community',k:'community'},{l:'Caste',k:'caste'},
    {l:'Register Number',k:'registerNumber'},{l:'Programme',k:'programme'},
    {l:'Department',k:'department'},{l:'Batch',k:'batch'},
    {l:'Admission Date',k:'admissionDate',t:'date'},
    {l:'Admission Category',k:'admissionCategory'},{l:'Admission Type',k:'admissionType'},
    {l:'Cut-Off',k:'cutOff'},{l:'EMIS No',k:'emis'},{l:'UMIS No',k:'umis'},{l:'Hostel Room',k:'hostelRoom'},
    {l:'Mobile',k:'mobile',t:'tel'},{l:'Parent Mobile',k:'parentMobile',t:'tel'},
    {l:'Personal Email',k:'personalEmail',t:'email'},{l:'Official Email',k:'officialEmail',t:'email'},
    {l:'Aadhar',k:'aadhar'},{l:'PAN',k:'pan'},
    {l:'Permanent Address',k:'permanentAddress',t:'textarea'},
    {l:'Temp Address',k:'tempAddress',t:'textarea'},
    {l:'City',k:'city'},{l:'State',k:'state'},{l:'ZIP',k:'zip'},
    {l:'Bank Name',k:'bankName'},{l:'Account Number',k:'accountNumber'},
    {l:'IFSC',k:'ifsc'},{l:'Bank Branch',k:'bankBranch'},
    {l:'First Graduate',k:'firstGraduate',o:['Yes','No']},
    {l:'Educational Loan',k:'educationalLoan',o:['Not Applicable','Applied','Approved','Disbursed']},
    {l:'Scholarship',k:'scholarshipType'}
  ];
  document.getElementById('egrid').innerHTML = fields.map(f => `
    <div class="ef"><label>${f.l}</label>
    ${f.o ? `<select id="e_${f.k}">${f.o.map(o=>`<option${s[f.k]===o?' selected':''}>${o}</option>`).join('')}</select>`
           : f.t==='textarea' ? `<textarea id="e_${f.k}">${s[f.k]||''}</textarea>`
           : `<input type="${f.t||'text'}" id="e_${f.k}" value="${s[f.k]||''}">`}
    </div>`).join('');
  document.getElementById('modal').classList.add('open');
}

document.getElementById('bsavem').addEventListener('click', async () => {
  const keys = ['firstName','lastName','gender','dob','bloodGroup','languages','physicalId','religion','community','caste',
    'registerNumber','programme','department','batch','admissionDate','admissionCategory','admissionType','cutOff','emis','umis','hostelRoom',
    'mobile','parentMobile','personalEmail','officialEmail','aadhar','pan','permanentAddress','tempAddress','city','state','zip',
    'bankName','accountNumber','ifsc','bankBranch','firstGraduate','educationalLoan','scholarshipType'];
  const upd = { updatedAt: serverTimestamp() };
  keys.forEach(k => { const el = document.getElementById('e_'+k); if(el) upd[k] = el.value.trim(); });
  try {
    await updateDoc(doc(db,'students',sid), upd);
    sdata = Object.assign({}, sdata, upd);
    document.getElementById('modal').classList.remove('open');
    render(sdata);
    toast('Student updated!');
  } catch(e) { toast('Update failed: '+e.message,'error'); }
});

async function delStudent() {
  if (!confirm(`Delete ${sdata.firstName||''} ${sdata.lastName||''}? Cannot be undone.`)) return;
  try {
    await deleteDoc(doc(db,'students',sid));
    toast('Student deleted.');
    setTimeout(() => location.href='students.html', 1200);
  } catch(e) { toast('Delete failed: '+e.message,'error'); }
}
</script>
</body>
</html>
