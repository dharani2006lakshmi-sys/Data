<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudentVault — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;min-height:100vh;background:#0a1628;color:#e8edf5;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;}
.wrap{width:100%;max-width:420px;padding:20px;}
.logo{text-align:center;margin-bottom:32px;}
.logo-icon{width:66px;height:66px;border-radius:16px;background:linear-gradient(135deg,#c9a84c,#e8c96a);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;}
.logo h1{font-size:1.8rem;color:#e8edf5;font-family:Georgia,serif;}
.logo p{color:#8a9bb5;font-size:.85rem;margin-top:5px;}
.card{background:#111e36;border:1px solid #1e3058;border-radius:16px;padding:32px;}
.card h2{font-size:1.2rem;color:#e8edf5;margin-bottom:20px;font-family:Georgia,serif;}
.err{background:rgba(224,92,92,.15);border:1px solid rgba(224,92,92,.4);color:#f08080;border-radius:8px;padding:11px 13px;font-size:.84rem;margin-bottom:14px;display:none;}
.lbl{display:block;font-size:.73rem;font-weight:700;color:#8a9bb5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.inp{width:100%;padding:12px 13px;margin-bottom:16px;background:#0a1628;border:1px solid #1e3058;border-radius:9px;color:#e8edf5;font-size:.92rem;outline:none;}
.inp:focus{border-color:#c9a84c;}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#c9a84c,#e8c96a);border:none;border-radius:9px;color:#0a1628;font-size:.95rem;font-weight:700;cursor:pointer;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.or{text-align:center;color:#8a9bb5;font-size:.8rem;margin:16px 0;}
.btn-g{width:100%;padding:11px;background:transparent;border:1px solid #1e3058;border-radius:9px;color:#e8edf5;font-size:.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;}
.btn-g:hover{border-color:#c9a84c;}
.btn-g img{width:18px;height:18px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">🎓</div>
    <h1>StudentVault</h1>
    <p>Student Information Management System</p>
  </div>
  <div class="card">
    <h2>Sign In</h2>
    <div class="err" id="err"></div>
    <label class="lbl">Email Address</label>
    <input class="inp" type="email" id="em" placeholder="admin@example.com">
    <label class="lbl">Password</label>
    <input class="inp" type="password" id="pw" placeholder="••••••••">
    <button class="btn" id="btnLogin">Sign In</button>
    <div class="or">— or —</div>
    <button class="btn-g" id="btnGoogle">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      Sign in with Google
    </button>
  </div>
</div>

<script type="module">
import { initializeApp }              from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged }
                                      from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyAWY0l0iJr2Pzk0TFLy2IQjD-y4i6gT5d8",
  authDomain:        "data-fc399.firebaseapp.com",
  projectId:         "data-fc399",
  storageBucket:     "data-fc399.firebasestorage.app",
  messagingSenderId: "239642224017",
  appId:             "1:239642224017:web:bf4f681a2492bf2e12e630"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Already logged in → go to dashboard
onAuthStateChanged(auth, u => {
  if (u) window.location.href = 'dashboard.html';
});

function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg;
  e.style.display = 'block';
}
function hideErr() { document.getElementById('err').style.display = 'none'; }
function setLoad(on) {
  document.getElementById('btnLogin').disabled = on;
  document.getElementById('btnGoogle').disabled = on;
  document.getElementById('btnLogin').textContent = on ? 'Signing in...' : 'Sign In';
}

// Email login
document.getElementById('btnLogin').addEventListener('click', async () => {
  hideErr();
  const em = document.getElementById('em').value.trim();
  const pw = document.getElementById('pw').value;
  if (!em) { showErr('Please enter your email.'); return; }
  if (!pw) { showErr('Please enter your password.'); return; }
  setLoad(true);
  try {
    await signInWithEmailAndPassword(auth, em, pw);
    window.location.href = 'dashboard.html';
  } catch (e) {
    setLoad(false);
    const msgs = {
      'auth/user-not-found':    'No account found with this email.',
      'auth/wrong-password':    'Wrong password. Try again.',
      'auth/invalid-credential':'Wrong email or password.',
      'auth/invalid-email':     'Invalid email format.',
      'auth/too-many-requests': 'Too many attempts. Try later.'
    };
    showErr(msgs[e.code] || e.message);
  }
});

// Google login
document.getElementById('btnGoogle').addEventListener('click', async () => {
  hideErr();
  setLoad(true);
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
    window.location.href = 'dashboard.html';
  } catch (e) {
    setLoad(false);
    showErr(e.message);
  }
});

// Enter key
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btnLogin').click();
});
</script>
</body>
</html>
