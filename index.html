<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudentVault — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;min-height:100vh;
  background:#0a1628;
  color:#e8edf5;
  font-family:Georgia,serif;
  display:flex;align-items:center;justify-content:center;
}
.wrap{width:100%;max-width:420px;padding:20px;}
.logo{text-align:center;margin-bottom:36px;}
.logo-icon{
  width:68px;height:68px;border-radius:18px;
  background:linear-gradient(135deg,#c9a84c,#e8c96a);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;margin:0 auto 14px;
}
.logo h1{font-size:1.9rem;color:#e8edf5;letter-spacing:.01em;}
.logo p{color:#8a9bb5;font-size:.88rem;margin-top:5px;font-family:Arial,sans-serif;}
.card{
  background:#111e36;border:1px solid #1e3058;
  border-radius:18px;padding:36px;
}
.card h2{font-size:1.3rem;color:#e8edf5;margin-bottom:24px;}
.err{
  background:rgba(224,92,92,.12);border:1px solid rgba(224,92,92,.3);
  color:#f08080;border-radius:8px;padding:10px 13px;
  font-size:.84rem;margin-bottom:14px;display:none;
  font-family:Arial,sans-serif;
}
.lbl{
  display:block;font-size:.75rem;font-weight:600;
  color:#8a9bb5;text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:7px;font-family:Arial,sans-serif;
}
input[type=email],input[type=password]{
  width:100%;padding:12px 14px;margin-bottom:18px;
  background:#0f2040;border:1px solid #1e3058;
  border-radius:10px;color:#e8edf5;
  font-family:Arial,sans-serif;font-size:.93rem;outline:none;
}
input:focus{border-color:#c9a84c;}
.btn-login{
  width:100%;padding:13px;
  background:linear-gradient(135deg,#c9a84c,#e8c96a);
  border:none;border-radius:10px;
  color:#0a1628;font-size:.95rem;font-weight:700;
  cursor:pointer;font-family:Arial,sans-serif;
}
.btn-login:hover{opacity:.9;}
.or{
  text-align:center;color:#8a9bb5;font-size:.82rem;
  margin:18px 0;font-family:Arial,sans-serif;
}
.btn-google{
  width:100%;padding:12px;
  background:transparent;border:1px solid #1e3058;
  border-radius:10px;color:#e8edf5;
  font-family:Arial,sans-serif;font-size:.9rem;
  cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:10px;
}
.btn-google:hover{border-color:#c9a84c;}
.btn-google img{width:18px;height:18px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">🎓</div>
    <h1>StudentVault</h1>
    <p>Student Information Management System</p>
  </div>
  <div class="card">
    <h2>Sign In</h2>
    <div class="err" id="err"></div>
    <label class="lbl">Email</label>
    <input type="email" id="em" placeholder="admin@example.com">
    <label class="lbl">Password</label>
    <input type="password" id="pw" placeholder="••••••••">
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="or">— or —</div>
    <button class="btn-google" onclick="doGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      Sign in with Google
    </button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
auth.onAuthStateChanged(u=>{if(u)location.href='dashboard.html';});
function showErr(m){var e=document.getElementById('err');e.textContent=m;e.style.display='block';}
function doLogin(){
  var em=document.getElementById('em').value.trim();
  var pw=document.getElementById('pw').value;
  if(!em||!pw){showErr('Please fill in all fields.');return;}
  auth.signInWithEmailAndPassword(em,pw)
    .then(()=>location.href='dashboard.html')
    .catch(e=>showErr(e.message));
}
function doGoogle(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .then(()=>location.href='dashboard.html')
    .catch(e=>showErr(e.message));
}
document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')doLogin();};
</script>
</body>
</html>
